<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приветствие</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .greeting-text {
            font-size: 22px;
            color: #764ba2;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        .form-input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background: #5e3a85;
        }

        .error-text {
            color: #e74c3c;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать!</h1>

        {% if greeting_name %}
            <p class="greeting-text">Привет, {{ greeting_name }}! 👋</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {% if form.name.errors %}
                <div class="error-text">
                    {{ form.name.errors.0 }}
                </div>
            {% endif %}

            {{ form.name }}

            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </div>
</body>
</html>
