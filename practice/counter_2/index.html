<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">

  <div class="flex flex-col items-center gap-6">

    <!-- Окно результата -->
    <div
      id="result"
      class="w-40 h-40 flex items-center justify-center rounded-[5px] text-5xl font-bold text-white bg-red-500 shadow-lg transition-colors duration-300"
    >
      0
    </div>

    <!-- Кнопки -->
    <div class="flex gap-4">
      <button
        id="minus"
        class="w-16 h-16 rounded-[5px] text-3xl font-bold text-white bg-gradient-to-r from-blue-400 to-blue-600 hover:from-blue-500 hover:to-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
      >
        −
      </button>

      <button
        id="plus"
        class="w-16 h-16 rounded-[5px] text-3xl font-bold text-white bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
      >
        +
      </button>
    </div>

    <!-- Окно сообщения -->
    <div
      id="message"
      class="min-h-8 text-white text-lg font-semibold text-center"
    ></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
